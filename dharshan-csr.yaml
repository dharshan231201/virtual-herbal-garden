# dharshan-csr.yaml
apiVersion: certificates.k8s.io/v1
kind: CertificateSigningRequest
metadata:
  name: dharshan-csr
spec:
  request:  # Paste the base64 string you copied above
  signerName: kubernetes.io/kube-apiserver-client
  expirationSeconds: 86400 # 24 hours, or a longer duration like 31536000 for 1 year
  usages:
  - client auth