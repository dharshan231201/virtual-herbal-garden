apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.service_name }}
  labels:
    app: {{ .Values.frontend.service_label }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    pod_label: {{ .Values.frontend.pod_label }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP