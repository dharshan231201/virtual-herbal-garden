# herbal-garden-application/templates/backend-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.service_name }}
  labels:
    app: {{ .Values.backend.service_label }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    pod_label: {{ .Values.backend.pod_label}}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
