services:
  # --- Client Service ---
  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: client_container
    ports:
      - "3001:80"
    depends_on:
      - auth-service
      - ai-service
      - plant-service
    restart: always

  # --- Authentication Service ---
  auth-service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    container_name: auth_container
    ports:
      - "8000:8000"
    env_file: .env
    restart: always

  # --- AI Service (Groq + PlantNet) ---
  ai-service:
    build:
      context: .
      dockerfile: ai_service/Dockerfile
    container_name: ai_container
    ports:
      - "8001:8001"
    env_file: .env
    restart: always

  # --- Plant Catalog Service ---
  plant-service:
    build:
      context: .
      dockerfile: plant_service/Dockerfile
    container_name: plant_container
    ports:
      - "8002:8002"
    env_file: .env
    restart: always

networks:
  default:
    name: herbal-network